name: External missing release credentials probe

on:
  workflow_dispatch:

permissions:
  actions: write
  checks: write
  contents: write
  
jobs:
  mobile-release:
    uses: lisagorewitdecker/RealtimeAlgoChatApp/.github/workflows/mobile-release.yml@8d603cfb875644cf856be29844981f8d605e4ef2
    with:
      native_smoke_ios_build_id: external-caller-probe-ios
      native_smoke_android_build_id: external-caller-probe-android
    secrets:
      GITHUB_WORKFLOW_PULL_TOKEN_FINAL: ${{ secrets.GITHUB_TOKEN }}
