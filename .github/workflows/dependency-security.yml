name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.8 --activate
      - name: Install without dependency lifecycle scripts
        # Keep scripts disabled without treating the blocked scripts as install failures.
        run: pnpm install --frozen-lockfile --ignore-scripts --config.strict-dep-builds=false
      - name: Verify security backports and dependency regressions
        run: node --test scripts/tests/*Security.test.ts
      - name: Audit all dependencies (fail on low or higher)
        # Version-only Forge alert is covered by the mandatory backport tests above.
        # Remove this single exception once an upstream fixed release replaces the patch.
        run: pnpm audit --audit-level low
